name: Build Linux release candidate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.1', cache: true}
      - run: bash scripts/check.sh
      - run: bash scripts/release.sh 0.1.0-rc.2
      - run: docker build --build-arg VERSION=0.1.0-rc.2 -t labrelay:0.1.0-rc.2 .
      - uses: actions/upload-artifact@v4
        with: {name: linux-release-candidate, path: dist/*.tar.gz}
      - uses: actions/upload-artifact@v4
        with: {name: checksums, path: dist/*SHA256SUMS}
